name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  UV_VERSION: "0.10.6"

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      docs_agents: ${{ steps.filter.outputs.docs_agents }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
            frontend:
              - 'frontend-react/**'
            shared:
              - 'Makefile'
              - 'docker-compose.yml'
              - 'docker/**'
              - '.github/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - '.pre-commit-config.yaml'
            docs_agents:
              - 'AGENTS.md'
              - 'docs/agents/**'

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-backend
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run tests
        env:
          LOG_DIR: /tmp/folio_test_logs
          DATABASE_URL: "sqlite://"
        run: uv run pytest -v --cov --cov-report=term-missing --cov-fail-under=85

      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: backend

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-backend
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-backend
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pyright
        run: uv run pyright .

  api-spec:
    name: OpenAPI Spec Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --frozen --directory backend

      - name: Export OpenAPI spec
        env:
          DATABASE_URL: "sqlite://"
          LOG_DIR: /tmp/folio_logs
        run: uv run --project backend python scripts/export_openapi.py

      - name: Check spec is up to date
        run: git diff --exit-code frontend-react/src/api/openapi.json

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ESLint
        run: npm run lint

  frontend-format:
    name: Frontend Format Check (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prettier check
        run: npm run format:check

  frontend-build:
    name: Frontend Build (TypeScript + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build (generate-api must be run locally if schemas changed)
        run: npm run build

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests with coverage
        run: npm run test:coverage

  frontend-security:
    name: Frontend Security (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=high

  constant-sync:
    name: Backend/Frontend Constant Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check constant sync
        run: uv run --no-project python scripts/check_constant_sync.py

  locale-parity:
    name: Locale Key Parity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check locale key parity
        run: uv run --no-project python scripts/check_locale_parity.py

  agent-doc-tokens:
    name: Agent Doc Token Budget Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.docs_agents == 'true' || needs.changes.outputs.shared == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check agent doc token budgets
        run: uv run --no-project python scripts/check_agent_doc_tokens.py

  agent-docs:
    name: Agent Doc Cross-Reference Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.docs_agents == 'true' || needs.changes.outputs.shared == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Check AGENTS.md cross-references
        run: bash scripts/check_agent_docs.sh

  ci-completeness:
    name: CI Completeness Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.shared == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check make ci covers all pipeline jobs
        run: uv run --with pyyaml --no-project python scripts/check_ci_completeness.py

  security:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-backend
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit (with retry for transient network errors)
        shell: bash
        run: |
          attempt=1
          max_attempts=3
          while [ $attempt -le $max_attempts ]; do
            echo "pip-audit attempt $attempt/$max_attempts"
            log_file=$(mktemp)
            if uv run pip-audit --desc --ignore-vuln CVE-2025-69872 > "$log_file" 2>&1; then
              cat "$log_file"
              rm -f "$log_file"
              exit 0
            fi
            if grep -qE "SSLError|MaxRetryError|UNEXPECTED_EOF_WHILE_READING|Connection.*timed out|Temporary failure in name resolution" "$log_file"; then
              cat "$log_file"
              rm -f "$log_file"
              if [ $attempt -lt $max_attempts ]; then
                sleep_seconds=$((attempt * 3))
                echo "Transient network error — retrying in ${sleep_seconds}s..."
                sleep $sleep_seconds
                attempt=$((attempt + 1))
                continue
              fi
              echo "pip-audit failed after $max_attempts attempts (transient network issues)"
              exit 1
            fi
            cat "$log_file"
            rm -f "$log_file"
            exit 1
          done

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend-react
          push: false
          build-args: VITE_API_KEY=ci-placeholder
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - test
      - lint
      - typecheck
      - api-spec
      - frontend-lint
      - frontend-format
      - frontend-build
      - frontend-test
      - frontend-security
      - constant-sync
      - locale-parity
      - agent-doc-tokens
      - agent-docs
      - ci-completeness
      - security
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"failure"|"cancelled"'; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
